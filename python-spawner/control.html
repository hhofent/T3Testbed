<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builder Guy · Python spawner</title>
<style>
:root{font:14px system-ui;color:#24322b;background:#edf0e9}*{box-sizing:border-box}body{margin:0}header{padding:14px 22px;background:#233e34;color:white;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,select,input{font:inherit;padding:6px;border:1px solid #aab9ac;border-radius:4px}button{cursor:pointer;background:#fff;color:#243d30}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 80px)}aside{overflow:auto;padding:16px;background:#fafbf7;border-right:1px solid #c7d1c4}section{padding:12px 0;border-bottom:1px solid #dce1d7}label{display:block;margin:6px 0}input[type=range]{width:100%;padding:0}input[type=number]{width:105px}details{margin:8px 0}summary{cursor:pointer;font-weight:600;padding:8px 0;overflow-wrap:anywhere}.leaf{padding:8px;border-left:2px solid #cbd7c7;margin:6px 0}.leaf>span{display:block;overflow-wrap:anywhere;font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}small{display:block;color:#647466;margin:5px 0}.map{overflow:auto;position:relative;padding:16px}.map img{width:100%;height:auto;display:block;background:white}.error{color:#b22}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{padding:8px 0}#changed{max-height:260px;overflow:auto}@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}aside{max-height:50vh}.map{min-height:50vh}}
</style>
<header><h1>Builder Guy / Python</h1><label>Seed <input id="seed" type="number" value="31"></label><button id="random">Random</button><button id="lock" aria-pressed="false">Lock seed</button><label><input id="town" type="checkbox" checked> Town close-up</label><label><input id="world" type="checkbox"> Endless world</label><button id="west">?</button><button id="north">?</button><button id="south">?</button><button id="east">?</button><button id="zoomIn">+</button><button id="zoomOut">?</button></header>
<main><aside><section><div class="row"><select id="presets" aria-label="Preset"></select><button id="apply">Stack preset</button><button id="reset">Reset all</button></div><div class="row"><button id="save">Save JSON</button><label>Load JSON <input id="load" type="file" accept="application/json,.json"></label></div><small>Presets stack; Reset restores defaults. Seed stays fixed while settings change.</small></section><section><details><summary>Changed from default <span id="count"></span></summary><pre id="changed">{}</pre></details></section><div id="controls"></div></aside><div class="map"><div id="status" role="status">Loading settings…</div><pre id="stats"></pre><img id="map" alt="Generated town and road map"></div></main>
<script>
'use strict';
let schema,defaults,values,timer,revision=0,locked=false,lastSettings,mile,viewport,drag;
const $=id=>document.getElementById(id),clone=x=>structuredClone(x);
function doc(){return {format:'python-spawner-settings',version:1,values:Object.fromEntries(Object.keys(values).filter(k=>JSON.stringify(values[k])!==JSON.stringify(defaults[k])).map(k=>[k,values[k]]))}}
function changes(){const d=doc();$('count').textContent=`(${Object.keys(d.values).length})`;$('changed').textContent=JSON.stringify(d.values,null,2);lastSettings=d}
function queue(){changes();clearTimeout(timer);const r=++revision;timer=setTimeout(()=>redraw(r),values['controls.debounce_ms'])}
async function redraw(r){$('status').className='';$('status').textContent='Generating…';try{const response=await fetch('/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seed:Number($('seed').value),settings:doc(),town:$('town').checked,world:$('world').checked,window:viewport})});const data=await response.json();if(r!==revision)return;if(!response.ok)throw Error(data.error);const canonical=clone(defaults);Object.assign(canonical,data.settings.values);if(JSON.stringify(canonical)!==JSON.stringify(values)){values=canonical;build();changes()}$('map').src='data:'+(data.image_type||'image/png')+';base64,'+data.image;$('stats').textContent=JSON.stringify(data.stats,null,2);$('status').textContent='Ready · deterministic seed '+$('seed').value}catch(e){if(r===revision){$('status').className='error';$('status').textContent=e.message}}}
function assign(key,path,value){if(!path.length)values[key]=value;else{let o=values[key];for(const p of path.slice(0,-1))o=o[p];o[path.at(-1)]=value}queue()}
function leaf(parent,key,path,value,lo,hi,step){const box=document.createElement('div');box.className='leaf';const name=document.createElement('span');name.textContent=path.length?path.join(' / '):key;box.append(name);const row=document.createElement('div');row.className='row';box.append(row);const label=key+'.'+path.join('.');
if(typeof value==='boolean'){const input=document.createElement('input');input.type='checkbox';input.checked=value;input.setAttribute('aria-label',label);input.onchange=()=>assign(key,path,input.checked);row.append(input)}
else if(typeof value==='number'){const slider=document.createElement('input'),input=document.createElement('input');slider.type='range';input.type='number';for(const x of [slider,input]){x.min=lo;x.max=hi;x.step=step;x.value=value;x.disabled=lo===hi;x.setAttribute('aria-label',label);x.oninput=()=>{if(x.value==='')return;const v=Math.max(lo,Math.min(hi,Number(x.value)));slider.value=input.value=v;assign(key,path,v)}}row.append(input,slider)}
else{const span=document.createElement('small');span.textContent=String(value)+' (reference invariant)';row.append(span)}parent.append(box)}
function fields(parent,key,value,lo,hi,path=[]){if(value!==null&&typeof value==='object'){for(const k of Object.keys(value))fields(parent,key,value[k],lo?.[k],hi?.[k],[...path,k])}else leaf(parent,key,path,value,lo,hi,schema[key].step)}
function build(){const host=$('controls');host.replaceChildren();for(const key of Object.keys(schema)){const spec=schema[key],detail=document.createElement('details'),summary=document.createElement('summary');summary.textContent=key;detail.append(summary);detail.open=key.startsWith('stages.');const note=document.createElement('small');note.textContent=`${spec.units} · ${spec.source} · ${spec.note}`;detail.append(note);fields(detail,key,values[key],spec.min,spec.max);const reset=document.createElement('button');reset.textContent='Reset setting';reset.onclick=()=>{values[key]=clone(defaults[key]);build();queue()};detail.append(reset);host.append(detail)}}
function pan(dx,dy){viewport[0]+=dx*viewport[2]*values['world.pan_fraction'];viewport[1]+=dy*viewport[3]*values['world.pan_fraction'];queue()}
function zoom(direction){const factor=direction>0?1/values['world.zoom_factor']:values['world.zoom_factor'];const size=Math.max(schema['world.window_miles'].min*mile,Math.min(schema['world.window_miles'].max*mile,viewport[2]*factor));viewport[0]+=(viewport[2]-size)/2;viewport[1]+=(viewport[3]-size)/2;viewport[2]=viewport[3]=size;queue()}
$('world').onchange=queue;$('west').onclick=()=>pan(-1,0);$('east').onclick=()=>pan(1,0);$('north').onclick=()=>pan(0,-1);$('south').onclick=()=>pan(0,1);$('zoomIn').onclick=()=>zoom(1);$('zoomOut').onclick=()=>zoom(-1);
$('map').onpointerdown=e=>{if(!$('world').checked)return;drag=[e.clientX,e.clientY];$('map').setPointerCapture(e.pointerId);e.preventDefault()};$('map').onpointerup=e=>{if(!drag)return;const b=$('map').getBoundingClientRect();viewport[0]-=(e.clientX-drag[0])/b.width*viewport[2];viewport[1]-=(e.clientY-drag[1])/b.height*viewport[3];drag=null;queue()};$('map').addEventListener('wheel',e=>{if(!$('world').checked)return;e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
$('seed').oninput=queue;$('town').onchange=queue;$('lock').onclick=()=>{locked=!locked;$('seed').readOnly=locked;$('random').disabled=locked;$('lock').textContent=locked?'Unlock seed':'Lock seed';$('lock').setAttribute('aria-pressed',String(locked))};$('random').onclick=()=>{if(locked)return;const a=new Uint32Array(1);crypto.getRandomValues(a);$('seed').value=a[0]%(schema['controls.seed'].max+1);queue()};
$('reset').onclick=()=>{values=clone(defaults);build();queue()};$('apply').onclick=async()=>{const r=await fetch('/preset/'+$('presets').value),d=await r.json();for(const [k,v]of Object.entries(d.values))values[k]=v;build();queue()};
$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(doc(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='builder-guy-preset.json';a.click();URL.revokeObjectURL(url)};
$('load').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!=='python-spawner-settings'||d.version!==1)throw Error('Unsupported preset');const next=clone(values);for(const[k,v]of Object.entries(d.values)){if(!(k in defaults))throw Error('Unknown setting: '+k);next[k]=v}values=next;build();queue()}catch(e){$('status').textContent=e.message}};
fetch('/schema').then(r=>r.json()).then(data=>{schema=data.schema;defaults=data.values;values=clone(defaults);mile=data.units_per_mile;viewport=[0,0,mile*values['world.window_miles'],mile*values['world.window_miles']];$('seed').value=values['controls.seed'];for(const name of data.presets){const o=document.createElement('option');o.value=o.textContent=name;$('presets').append(o)}build();queue()}).catch(e=>$('status').textContent=e.message);
</script></html>
