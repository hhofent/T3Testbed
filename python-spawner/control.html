<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builder Guy / Python spawner</title>
<style>
:root{font:14px system-ui;color:#24322b;background:#edf0e9}*{box-sizing:border-box}body{margin:0}header{padding:14px 22px;background:#233e34;color:white;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,select,input{font:inherit;padding:6px;border:1px solid #aab9ac;border-radius:4px}button{cursor:pointer;background:#fff;color:#243d30}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 80px)}aside{overflow:auto;padding:16px;background:#fafbf7;border-right:1px solid #c7d1c4}section{padding:12px 0;border-bottom:1px solid #dce1d7}label{display:block;margin:6px 0}input[type=range]{width:100%;padding:0}input[type=number]{width:105px}details{margin:8px 0}summary{cursor:pointer;font-weight:600;padding:8px 0;overflow-wrap:anywhere}.leaf{padding:8px;border-left:2px solid #cbd7c7;margin:6px 0}.leaf>span{display:block;overflow-wrap:anywhere;font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}small{display:block;color:#647466;margin:5px 0}.map{overflow:auto;position:relative;padding:16px}.map img{width:100%;height:auto;display:block;background:white}.error{color:#b22}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{padding:8px 0}#changed{max-height:260px;overflow:auto}@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}aside{max-height:50vh}.map{min-height:50vh}}
</style>
<header><h1>Builder Guy / Python</h1><label>Seed <input id="seed" type="number" value="31"></label><button id="random">Random</button><button id="lock" aria-pressed="false">Lock seed</button><button id="findTown">Find a town</button><button id="prevTown">Previous town</button><button id="nextTown">Next town</button><label>Town zoom (mi) <input id="townZoom" type="number" min="0.05" max="2" step="0.05" value="0.5"></label><button id="west" aria-label="Pan west">West</button><button id="north" aria-label="Pan north">North</button><button id="south" aria-label="Pan south">South</button><button id="east" aria-label="Pan east">East</button><button id="zoomIn">+</button><button id="zoomOut" aria-label="Zoom out">-</button></header>
<main><aside><section><div class="row"><select id="presets" aria-label="Preset"></select><button id="apply">Stack preset</button><button id="reset">Reset all</button></div><div class="row"><button id="save">Save JSON</button><label>Load JSON <input id="load" type="file" accept="application/json,.json"></label></div><small>Presets stack; Reset restores defaults. Seed stays fixed while settings change.</small></section><section><details><summary>Changed from default <span id="count"></span></summary><pre id="changed">{}</pre></details></section><div id="controls"></div></aside><div class="map"><div id="status" role="status">Loading settings...</div><pre id="stats"></pre><div id="tiles" style="position:relative;width:100%;aspect-ratio:1;overflow:hidden;display:none"></div><img id="map" alt="Generated town and road map"></div></main>
<script>
'use strict';
let schema,defaults,values,timer,revision=0,locked=false,lastSettings,mile,viewport,drag;
const $=id=>document.getElementById(id),clone=x=>structuredClone(x);
function doc(){return {format:'python-spawner-settings',version:1,values:Object.fromEntries(Object.keys(values).filter(k=>JSON.stringify(values[k])!==JSON.stringify(defaults[k])).map(k=>[k,values[k]]))}}
function changes(){const d=doc();$('count').textContent=`(${Object.keys(d.values).length})`;$('changed').textContent=JSON.stringify(d.values,null,2);lastSettings=d}
let settledRevision=0;
function queue(){const signature=JSON.stringify([$('seed').value,doc().values]);if(signature!==viewSignature){chunkKey='';towns.clear();townList=[];viewSignature=signature;}paintChunks();changes();clearTimeout(timer);const r=++revision;timer=setTimeout(()=>redraw(r),values['controls.debounce_ms'])}
async function redraw(r){await redrawChunks(r)}
const chunkImages=new Map(),towns=new Map();let chunkKey='',previousView,viewSignature='',townList=[],townIndex=-1;
function lod(){return Math.max(viewport[2],viewport[3])<=2*mile?'detail':'overview'}
function imageKey(x,y){return viewSignature+':'+lod()+':'+x+':'+y}
function paintChunks(){if(!viewport)return;$('map').style.display='none';const host=$('tiles');host.style.display='block';host.style.background='#deded2';const size=values['world.chunk_miles']*mile,keep=new Set();
for(let x=Math.floor(viewport[0]/size);x<Math.ceil((viewport[0]+viewport[2])/size);x++)for(let y=Math.floor(viewport[1]/size);y<Math.ceil((viewport[1]+viewport[3])/size);y++){
 const key=imageKey(x,y);keep.add(key);let img=[...host.children].find(n=>n.dataset.key===key);if(!img){img=document.createElement('img');img.dataset.key=key;img.alt='';img.draggable=false;host.append(img)}const src=chunkImages.get(key);if(src&&img.getAttribute('src')!==src)img.src=src;
 Object.assign(img.style,{position:'absolute',left:((x*size-viewport[0])/viewport[2]*100)+'%',top:((y*size-viewport[1])/viewport[3]*100)+'%',width:(size/viewport[2]*100)+'%',height:(size/viewport[3]*100)+'%',padding:'0',pointerEvents:'none',visibility:src?'visible':'hidden'});
}for(const n of [...host.children])if(!keep.has(n.dataset.key))n.remove();}
async function redrawChunks(r){try{const view=[...viewport],signature=viewSignature,level=lod(),direction=previousView?[view[0]-previousView[0],view[1]-previousView[1]]:[0,0];previousView=view;const size=values['world.chunk_miles']*mile,known=[];for(let x=Math.floor(view[0]/size);x<Math.ceil((view[0]+view[2])/size);x++)for(let y=Math.floor(view[1]/size);y<Math.ceil((view[1]+view[3])/size);y++)if(chunkImages.has(imageKey(x,y)))known.push(x+':'+y);
const response=await fetch('/chunks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seed:Number($('seed').value),settings:doc(),window:view,direction,detail:level==='detail',known})});const data=await response.json();if(r!==revision)return;if(!response.ok)throw Error(data.error);chunkKey=data.key;
for(const c of data.chunks)if(c.svg){const key=signature+':'+level+':'+c.x+':'+c.y;chunkImages.set(key,'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(c.svg));const xml=new DOMParser().parseFromString(c.svg,'image/svg+xml');for(const title of xml.querySelectorAll('title'))if(title.textContent.trim().endsWith(':town')){const rect=title.nextElementSibling;if(rect?.tagName==='rect')towns.set(title.textContent.trim(),['x','y','width','height'].map(k=>Number(rect.getAttribute(k))))}}
while(chunkImages.size>256)chunkImages.delete(chunkImages.keys().next().value);paintChunks();if(!data.pending)settledRevision=r;$('status').textContent=data.pending?'Generating visible chunks...':`Ready / ${(viewport[2]/mile).toFixed(2)} mi wide / ${level}`;if(data.pending)timer=setTimeout(()=>redrawChunks(r),50)
}catch(e){if(r===revision)$('status').textContent=e.message}}
function assign(key,path,value){if(key==='world.window_miles'&&!path.length&&viewport){const size=value*mile;viewport[0]+=(viewport[2]-size)/2;viewport[1]+=(viewport[3]-size)/2;viewport[2]=viewport[3]=size}if(!path.length)values[key]=value;else{let o=values[key];for(const p of path.slice(0,-1))o=o[p];o[path.at(-1)]=value}queue()}
function leaf(parent,key,path,value,lo,hi,step){const box=document.createElement('div');box.className='leaf';const name=document.createElement('span');const spec=schema[key],scale=spec.display_scale||1;name.textContent=(path.length?path.map(p=>/^\d+$/.test(p)?'Item '+(Number(p)+1):p.replaceAll('_',' ')).join(' / '):spec.label)+' ('+spec.display_units+')';box.title=spec.help;box.append(name);const row=document.createElement('div');row.className='row';box.append(row);const label=spec.label+(path.length?' / '+path.join(' / '):'');
if(typeof value==='boolean'){const input=document.createElement('input');input.type='checkbox';input.checked=value;input.setAttribute('aria-label',label);input.onchange=()=>assign(key,path,input.checked);row.append(input)}
else if(typeof value==='number'){const slider=document.createElement('input'),input=document.createElement('input');slider.type='range';input.type='number';for(const x of [slider,input]){x.min=lo/scale;x.max=hi/scale;x.step=step/scale;x.value=value/scale;x.title=spec.help;x.disabled=lo===hi;x.setAttribute('aria-label',label);x.oninput=()=>{if(x.value==='')return;const v=Math.max(lo,Math.min(hi,Math.round(Number(x.value)*scale/step)*step));slider.value=input.value=v/scale;assign(key,path,v)}}row.append(input,slider)}
else{const span=document.createElement('small');span.textContent=String(value)+' (reference invariant)';row.append(span)}parent.append(box)}
function fields(parent,key,value,lo,hi,path=[]){if(value!==null&&typeof value==='object'){for(const k of Object.keys(value))fields(parent,key,value[k],lo?.[k],hi?.[k],[...path,k])}else leaf(parent,key,path,value,lo,hi,schema[key].step)}
function build(){const host=$('controls');host.replaceChildren();const groups=new Map();const order=['Generation stages','Endless world and navigation','Towns, roads and countryside','Rail and waterways','Houses and lots','Trees','Validation and repair','Page behavior','Advanced reference rules'];for(const title of order){const group=document.createElement('details'),heading=document.createElement('summary');heading.textContent=title;group.append(heading);group.open=title==='Generation stages'||title==='Endless world and navigation';host.append(group);groups.set(title,group)}for(const key of Object.keys(schema)){const spec=schema[key],detail=document.createElement('details'),summary=document.createElement('summary');summary.textContent=spec.label;summary.title=spec.help;detail.append(summary);detail.open=key.startsWith('stages.');const note=document.createElement('small');note.textContent=spec.help;detail.append(note);fields(detail,key,values[key],spec.min,spec.max);const reset=document.createElement('button');reset.textContent='Reset '+spec.label.toLowerCase();reset.onclick=()=>{values[key]=clone(defaults[key]);build();queue()};detail.append(reset);groups.get(spec.group).append(detail)}}
function pan(dx,dy){viewport[0]+=dx*viewport[2]*values['world.pan_fraction'];viewport[1]+=dy*viewport[3]*values['world.pan_fraction'];queue()}
function zoom(direction,anchor=[.5,.5]){const factor=direction>0?1/values['world.zoom_factor']:values['world.zoom_factor'];const size=Math.max(schema['world.window_miles'].min*mile,Math.min(schema['world.window_miles'].max*mile,viewport[2]*factor));viewport[0]+=(viewport[2]-size)*anchor[0];viewport[1]+=(viewport[3]-size)*anchor[1];viewport[2]=viewport[3]=size;queue()}
$('west').onclick=()=>pan(-1,0);$('east').onclick=()=>pan(1,0);$('north').onclick=()=>pan(0,-1);$('south').onclick=()=>pan(0,1);$('zoomIn').onclick=()=>zoom(1);$('zoomOut').onclick=()=>zoom(-1);
const surface=$('tiles');surface.style.touchAction='none';surface.style.cursor='grab';
surface.onpointerdown=e=>{drag=[e.clientX,e.clientY,...viewport];surface.setPointerCapture(e.pointerId);e.preventDefault()};
surface.onpointermove=e=>{if(!drag)return;const b=surface.getBoundingClientRect();viewport[0]=drag[2]-(e.clientX-drag[0])/b.width*viewport[2];viewport[1]=drag[3]-(e.clientY-drag[1])/b.height*viewport[3];queue()};
surface.onpointerup=surface.onpointercancel=()=>{drag=null};surface.addEventListener('wheel',e=>{e.preventDefault();const b=surface.getBoundingClientRect();zoom(e.deltaY<0?1:-1,[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height])},{passive:false});
function visitTown(step){if(!townList.length)return;$('status').textContent='Finding town...';townIndex=(townIndex+step+townList.length)%townList.length;const [x,y,w,h]=townList[townIndex],size=Math.max(.05,Math.min(2,Number($('townZoom').value)||.5))*mile;viewport=[x+w/2-size/2,y+h/2-size/2,size,size];queue()}
$('findTown').onclick=async()=>{if(!values['stages.towns']){$('status').textContent='Enable towns in the generation controls first';return}const cx=viewport[0]+viewport[2]/2,cy=viewport[1]+viewport[3]/2;for(let width=12;!towns.size&&width<=96;width*=2){viewport=[cx-width*mile/2,cy-width*mile/2,width*mile,width*mile];queue();const r=revision;while(settledRevision!==r){await new Promise(resolve=>setTimeout(resolve,50));if(revision!==r)return}}townList=[...towns.values()].sort((a,b)=>Math.hypot(a[0]+a[2]/2-cx,a[1]+a[3]/2-cy)-Math.hypot(b[0]+b[2]/2-cx,b[1]+b[3]/2-cy));townIndex=-1;if(!townList.length){$('status').textContent='No generated town nearby; pan and search again';return}visitTown(1)};$('nextTown').onclick=()=>visitTown(1);$('prevTown').onclick=()=>visitTown(-1);
$('seed').oninput=queue;$('lock').onclick=()=>{locked=!locked;$('seed').readOnly=locked;$('random').disabled=locked;$('lock').textContent=locked?'Unlock seed':'Lock seed';$('lock').setAttribute('aria-pressed',String(locked))};$('random').onclick=()=>{if(locked)return;const a=new Uint32Array(1);crypto.getRandomValues(a);$('seed').value=a[0]%(schema['controls.seed'].max+1);queue()};
$('reset').onclick=()=>{values=clone(defaults);build();queue()};$('apply').onclick=async()=>{const r=await fetch('/preset/'+$('presets').value),d=await r.json();for(const [k,v]of Object.entries(d.values))values[k]=v;build();queue()};
$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(doc(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='builder-guy-preset.json';a.click();URL.revokeObjectURL(url)};
$('load').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!=='python-spawner-settings'||d.version!==1)throw Error('Unsupported preset');const next=clone(values);for(const[k,v]of Object.entries(d.values)){if(!(k in defaults))throw Error('Unknown setting: '+k);next[k]=v}values=next;build();queue()}catch(e){$('status').textContent=e.message}};
fetch('/schema').then(r=>r.json()).then(data=>{schema=data.schema;defaults=data.defaults;values=clone(data.values);mile=data.units_per_mile;viewport=[0,0,mile*values['world.window_miles'],mile*values['world.window_miles']];$('seed').value=values['controls.seed'];for(const name of data.presets){const o=document.createElement('option');o.value=o.textContent=name;$('presets').append(o)}build();queue()}).catch(e=>$('status').textContent=e.message);
</script></html>
